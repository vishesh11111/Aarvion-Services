# =============================================================================
# Development overlay — infrastructure only.
#
#   docker compose -f docker-compose.dev.yml up -d
#   npm run db:indexes && npm run db:seed
#   npm run dev
#
# Runs MongoDB and Redis in containers while the API, worker and web app run on
# the host with hot reload. Rebuilding an image on every code change is the
# single biggest drag on iteration speed, and containerising the app locally
# buys nothing that `npm run dev` does not already give you.
#
# Skip this entirely if you are pointing MONGODB_URI at Atlas — then you only
# need Redis:  docker compose -f docker-compose.dev.yml up -d redis
# =============================================================================

name: aarvion-crm-dev

services:
  # Single-node replica set — see the note in docker-compose.yml for why a plain
  # mongod is not good enough (transactions).
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mongo_dev_data:
  redis_dev_data:
